<!DOCTYPE html>
<html>
<head>
  <title>DEBATRIXX</title>
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #0f0f1a;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 18px;
      background: #141428;
      text-align: center;
    }
    .app { display:flex; flex:1; }
    .sidebar {
      width:260px;
      background:#141428;
      padding:15px;
      overflow:auto;
    }
    .roomCard {
      background:rgba(255,255,255,0.06);
      padding:12px;
      margin-bottom:10px;
      border-radius:10px;
      cursor:pointer;
    }
    .main {
      flex:1;
      padding:20px;
      display:flex;
      flex-direction:column;
    }
    input {
      padding:12px;
      border-radius:10px;
      border:none;
      background:rgba(255,255,255,0.08);
      color:white;
      margin:5px 0;
    }
    button {
      padding:12px;
      border-radius:10px;
      border:none;
      margin-top:5px;
      background:#4da6ff;
      cursor:pointer;
    }
    .chat {
      flex:1;
      overflow:auto;
      margin:10px 0;
    }
    .msg {
      background:rgba(255,255,255,0.06);
      padding:8px;
      margin-bottom:5px;
      border-radius:8px;
    }
    video {
      width:140px;
      margin:5px;
      border-radius:10px;
      background:#000;
    }
  </style>
</head>
<body>

<header>
  <h1>DEBATRIXX</h1>
  <div>FOUNDER: ALBION SELIMI | CO-FOUNDER: ARDIT DZJELJADINI</div>
</header>

<div class="app">
  <div class="sidebar">
    <h3>Public Rooms</h3>
    <div id="publicRooms"></div>
  </div>

  <div class="main">
    <div id="setup">
      <input id="username" placeholder="Username">
      <input id="topic" placeholder="Room topic">
      <input id="maxUsers" type="number" min="1" placeholder="Max users">
      <button id="createRoomBtn">Create Room</button>

      <input id="joinCode" placeholder="Code">
      <button id="joinPrivateBtn">Join Private</button>
    </div>

    <div id="room" style="display:none;">
      <h3 id="roomTitle"></h3>
      <div id="messages" class="chat"></div>
      <input id="msgInput" placeholder="Type message...">
      <button id="sendBtn">Send</button>
      <button id="backBtn">Back</button>
      <button id="joinCallBtn">Join Call</button>
      <button id="leaveCallBtn">Leave Call</button>
      <div id="videos"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  query,
  where,
  getDocs,
  orderBy,
  doc,
  setDoc,
  getDoc,
