<!DOCTYPE html>
<html>
<head>
  <title>DEBATRIXX</title>

  <script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@500&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #0f0f1a;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 18px;
      background: #141428;
      text-align: center;
    }

    .app { display:flex; flex:1; }

    .sidebar {
      width:260px;
      background:#141428;
      padding:15px;
    }

    .roomCard {
      background:rgba(255,255,255,0.06);
      padding:12px;
      margin-bottom:10px;
      border-radius:10px;
      cursor:pointer;
    }

    .main {
      flex:1;
      padding:20px;
      display:flex;
      flex-direction:column;
    }

    input {
      padding:12px;
      border-radius:10px;
      border:none;
      background:rgba(255,255,255,0.08);
      color:white;
      margin:5px 0;
    }

    button {
      padding:12px;
      border-radius:10px;
      border:none;
      margin-top:5px;
      background:#4da6ff;
      cursor:pointer;
    }

    .chat {
      flex:1;
      overflow:auto;
      margin:10px 0;
    }

    .msg {
      background:rgba(255,255,255,0.06);
      padding:8px;
      margin-bottom:5px;
      border-radius:8px;
    }

    video {
      width:140px;
      margin:5px;
      border-radius:10px;
    }
  </style>
</head>

<body>

<header>
  <h1>DEBATRIXX</h1>
  <div>
    FOUNDER: ALBION SELIMI | CO-FOUNDER: ARDIT DZJELJADINI
  </div>
</header>

<div class="app">

<div class="sidebar">
  <h3>Public Rooms</h3>
  <div id="publicRooms"></div>
</div>

<div class="main">

<div id="setup">
  <input id="username" placeholder="Username">
  <input id="topic" placeholder="Room topic">
  <input id="maxUsers" placeholder="Max users">

  <button onclick="createRoom()">Create Room</button>

  <input id="joinCode" placeholder="Code">
  <button onclick="joinByCode()">Join Private</button>
</div>

<div id="room" style="display:none;">
  <h3 id="roomTitle"></h3>

  <div id="messages" class="chat"></div>

  <input id="msgInput" placeholder="Type message...">

  <button onclick="sendMsg()">Send</button>

  <button onclick="goBack()">Back</button>

  <button onclick="joinCall()">Join Call</button>
  <button onclick="leaveCall()">Leave Call</button>

  <div id="videos"></div>
</div>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, where, getDocs, orderBy, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB5N2fi-G73BtY6ptTRI-vzkxfLGRB-Hy4",
  authDomain: "debatrixx-aaa44.firebaseapp.com",
  projectId: "debatrixx-aaa44"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* UNIQUE USER */
let userId = localStorage.getItem("uid");
if (!userId) {
  userId = Math.random().toString(36).substring(2);
  localStorage.setItem("uid", userId);
}

let currentRoom = null;

/* CREATE */
window.createRoom = async ()=>{
  if(!topic.value || !maxUsers.value) return alert("Fill all");

  const docRef = await addDoc(collection(db,"rooms"),{
    topic:topic.value,
    code:Math.random().toString(36).substring(2,8),
    maxUsers:parseInt(maxUsers.value)
  });

  openRoom(docRef.id,topic.value);
};

/* PUBLIC */
onSnapshot(collection(db,"rooms"), snap=>{
  let html="";
  snap.docs.forEach(r=>{
    const d=r.data();
    html+=`<div class="roomCard" onclick="joinRoom('${r.id}','${d.topic}',${d.maxUsers})">
      ${d.topic}
    </div>`;
  });
  publicRooms.innerHTML=html;
});

/* JOIN */
window.joinRoom = async(id,title,max)=>{
  const userRef = doc(db,"rooms",id,"users",userId);
  const exists = await getDoc(userRef);

  const usersSnap = await getDocs(collection(db,"rooms",id,"users"));

  if (usersSnap.size >= max) return alert("Room full");

  if (!exists.exists()) {
    await setDoc(userRef,{joined:true});
  }

  openRoom(id,title);
};

window.joinByCode = async()=>{
  const snap = await getDocs(query(collection(db,"rooms"), where("code","==",joinCode.value)));
  if(snap.empty) return alert("Invalid");

  const r=snap.docs[0];
  const d=r.data();

  joinRoom(r.id,d.topic,d.maxUsers);
};

/* OPEN */
window.openRoom = (id,title)=>{
  currentRoom=id;
  setup.style.display="none";
  room.style.display="block";
  roomTitle.innerText=title;

  onSnapshot(query(collection(db,"rooms",id,"messages"),orderBy("createdAt")), snap=>{
    let html="";
    snap.docs.forEach(m=>{
      const d=m.data();
      html+=`<div class="msg">${d.user}: ${d.text}</div>`;
    });
    messages.innerHTML=html;
    messages.scrollTop = messages.scrollHeight;
  });
};

/* BACK */
window.goBack=()=>{
  setup.style.display="block";
  room.style.display="none";
};

/* SEND */
window.sendMsg=async()=>{
  if(!msgInput.value) return;

  await addDoc(collection(db,"rooms",currentRoom,"messages"),{
    text:msgInput.value,
    user:username.value||"Anon",
    createdAt:Date.now()
  });

  msgInput.value="";
};

/* 🔥 ENTER KEY FIX */
document.getElementById("msgInput").addEventListener("keydown", (e)=>{
  if(e.key === "Enter"){
    e.preventDefault();
    sendMsg();
  }
});

/* CALLS */
const APP_ID="a77e9ac654bf419db638a95bb95d7eac";
let client,localTracks=[];

window.joinCall=async()=>{
  client=AgoraRTC.createClient({mode:"rtc",codec:"vp8"});
  await client.join(APP_ID,currentRoom,null,userId);

  localTracks=await AgoraRTC.createMicrophoneAndCameraTracks();

  const video=document.createElement("video");
  video.autoplay=true;
  video.muted=true;
  videos.appendChild(video);

  localTracks[1].play(video);
  await client.publish(localTracks);

  client.on("user-published", async (user,mediaType)=>{
    await client.subscribe(user,mediaType);

    if(mediaType==="video"){
      const remote=document.createElement("video");
      remote.autoplay=true;
      videos.appendChild(remote);
      user.videoTrack.play(remote);
    }

    if(mediaType==="audio"){
      user.audioTrack.play();
    }
  });
};

window.leaveCall=async()=>{
  localTracks.forEach(t=>{t.stop();t.close();});
  await client.leave();
  videos.innerHTML="";
};
</script>

</body>
</html>
